<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#050814" />
  <meta name="description" content="NightCheck HUD — live sky intelligence." />
  <title>NightCheck HUD</title>
  <base href="./" />
  <link rel="stylesheet" href="style.v3.css" />
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <main class="hud">
    <header class="hud-top">
      <div class="brand"><span class="brand-mark">✦</span><div><strong>NIGHTCHECK</strong><small>SKY INTELLIGENCE HUD</small></div></div>
      <div class="hud-status"><span class="pulse"></span><span id="status">CONNECTING</span></div>
    </header>
    <section class="hud-center">
      <div class="hud-ring"><div class="hud-crosshair">+</div><div class="hud-orb"></div></div>
      <div class="hud-title">LIVE SKY</div>
      <div class="hud-subtitle">REAL-TIME OBSERVATION SYSTEM</div>
    </section>
    <section class="hud-readouts">
      <div class="readout"><span>✈</span><b id="aircraftCount">—</b><small>AIRCRAFT</small></div>
      <div class="readout"><span>◈</span><b id="satelliteCount">—</b><small>SATELLITES</small></div>
      <div class="readout"><span>★</span><b id="starCount">—</b><small>STARS</small></div>
      <div class="readout"><span>⌖</span><b id="coords">54.90°, 23.90°</b><small>OBSERVER</small></div>
    </section>
    <footer class="hud-bottom"><span>SYSTEM ONLINE</span><span>OPEN SKY · CELESTRAK · HYG</span><span>◉ LIVE</span></footer>
  </main>
  <script src="app.v3.js"></script>
</body>
</html>
